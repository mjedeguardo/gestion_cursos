<div class="header-actions">
  <h2>Gestión de Cursos</h2>
  <button class="btn-primary" (click)="abrirModalCrear()">+ Nuevo Curso</button>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Sección</th><th>Nombre del Curso</th><th>Descripción</th><th>Estado</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let curso of cursos" appResaltar>
        <td>{{ curso.id_curso }}</td>
        <td>{{ curso.id_seccion }}</td>
        <td>{{ curso.nombre }}</td>
        <td>{{ curso.descripcion }}</td>
        <td><span class="badge" [ngClass]="curso.estado === 1 ? 'bg-success' : 'bg-danger'">{{ curso.estado | estado }}</span></td>
        <td>
          <button class="btn-edit" (click)="abrirModalEditar(curso)">Editar</button>
          <button class="btn-delete" (click)="eliminar(curso.id_curso)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <h3>{{ editando ? 'Editar' : 'Nuevo' }} Curso</h3>
    <div class="form-group"><label>ID Sección:</label><input type="number" [(ngModel)]="cursoActual.id_seccion"></div>
    <div class="form-group"><label>Nombre:</label><input type="text" [(ngModel)]="cursoActual.nombre"></div>
    <div class="form-group"><label>Descripción:</label><input type="text" [(ngModel)]="cursoActual.descripcion"></div>
    <div class="form-group">
      <label>Estado:</label>
      <select [(ngModel)]="cursoActual.estado"><option [value]="1">Activo</option><option [value]="0">Inactivo</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-save" (click)="guardar()">Guardar</button>
    </div>
  </div>
</div>
