<div class="header-actions">
  <h2>Gestión de Alumnos</h2>
  <button class="btn-primary" (click)="abrirModalCrear()">+ Nuevo Alumno</button>
</div>

<div class="table-container">
  <table class="responsive-table">
    <thead>
      <tr>
        <th>ID</th><th>ID Usuario</th><th>DNI Apoderado</th><th>Teléfono</th><th>F. Nacimiento</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let alumno of alumnos" appResaltar>
        <td data-label="ID">{{ alumno.id_alumno }}</td>
        <td data-label="ID Usuario">{{ alumno.id_usuario }}</td>
        <td data-label="DNI Apoderado">{{ alumno.dni_apoderado }}</td>
        <td data-label="Teléfono">{{ alumno.telefono }}</td>
        <td data-label="F. Nacimiento">{{ alumno.fecha_nacimiento }}</td>
        <td data-label="Acciones">
          <div class="action-buttons">
            <button class="btn-edit" (click)="abrirModalEditar(alumno)">Editar</button>
            <button class="btn-delete" (click)="eliminar(alumno.id_alumno)">Eliminar</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal-content">
    <h3>{{ editando ? 'Editar' : 'Nuevo' }} Alumno</h3>
    <div class="form-group"><label>ID Usuario:</label><input type="number" [(ngModel)]="alumnoActual.id_usuario"></div>
    <div class="form-group"><label>DNI Apoderado:</label><input type="text" [(ngModel)]="alumnoActual.dni_apoderado" maxlength="8"></div>
    <div class="form-group"><label>Teléfono:</label><input type="text" [(ngModel)]="alumnoActual.telefono"></div>
    <div class="form-group"><label>F. Nacimiento:</label><input type="date" [(ngModel)]="alumnoActual.fecha_nacimiento"></div>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-save" (click)="guardar()">Guardar</button>
    </div>
  </div>
</div>
