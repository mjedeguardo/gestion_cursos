<div class="login-wrapper">
  
  <!-- LADO IZQUIERDO: Imagen desde la nube -->
  <div class="login-left">
    <img src="https://img.magnific.com/vector-gratis/ilustracion-neuroeducacion-dibujada-mano_23-2150945405.jpg?semt=ais_hybrid&w=740&q=80" alt="Estudiante" class="imagen-fondo">
  </div>

  <!-- LADO DERECHO: Formulario -->
  <div class="login-right">
    <div class="login-form-container">
      <div class="logo-area">
        <h1>EDU<span>CACIÓN</span></h1>
        <p>Bienvenido de Nuevo !</p>
      </div>

      <form (ngSubmit)="login()">
        <div class="form-group">
          <label>EMAIL ID</label>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="kunal@bvp.com">
        </div>

        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" [(ngModel)]="password" name="password" required placeholder="********">
        </div>

        <div class="forgot-password">
          <a href="#">Olvidaste tu contraseña?</a>
        </div>

        <div *ngIf="errorMensaje" class="error-msg">
          {{ errorMensaje }}
        </div>

        <button type="submit" class="btn-login">Log In</button>
      </form>
    </div>
  </div>

</div>
