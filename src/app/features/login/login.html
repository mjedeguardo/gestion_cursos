<div class="login-container">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Sistema de Gestión Académica</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="admin@test.com">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="123456">
      </div>

      <div *ngIf="errorMensaje" class="error-msg">
        {{ errorMensaje }}
      </div>

      <button type="submit">Ingresar</button>
    </form>
    
    <div class="hint">
      <small>Usa: <b>admin@test.com</b> / <b>123456</b></small>
    </div>
  </div>
</div>
